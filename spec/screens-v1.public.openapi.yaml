  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
      description: 'An API key from the dashboard (`kubi_...`, read from `KUBI_API_KEY` by the SDK). Keys carry
        permissions: `read` (see screens, screenshots, history), `control` (click, type, scroll), `exec` (commands
        and files) and `power` (create, start, stop, delete). MCP clients sign in with OAuth at the hosted MCP server
        instead; this API refuses those tokens.'
