          - type: string
            maxLength: 10
        credential_id:
          oneOf:
          - type: string
            maxLength: 40
          - type: "null"
        credential_name:
          oneOf:
          - type: string
            maxLength: 100
          - type: "null"
        user_id:
          oneOf:
          - type: string
            pattern: ^usr_[0-9a-z]{20}$
            maxLength: 24
          - type: "null"
    HistoryEntry:
      type: object
      title: HistoryEntry
      description: One call or event. Kept 30 days.
      required:
      - id
      - at
      - kind
      - actor
      - summary
      - result
      - screenshot_saved
      properties:
        id:
          type: string
          maxLength: 30
          pattern: ^evt_[0-9a-z]{20}$
        at:
          type: string
          format: date-time
          maxLength: 40
        screen_id:
          oneOf:
          - type: string
            pattern: ^scr_[0-9a-z]{20}$
            maxLength: 24
          - type: "null"
        screen_kind:
          oneOf:
          - $ref: '#/components/schemas/ScreenKind'
            description: The screen's kind when the row was written; null for an account event.
          - type: "null"
        kind:
          type: string
          maxLength: 40
          description: "`call` for a call on the screen; otherwise an event such as screen.created, screen.deleted,\
            \ key.created, key.revoked, app.connected, secret.set, proxy.set, control.taken or control.released.\
            \ New kinds may appear."
        operation:
          oneOf:
          - type: string
            maxLength: 40
            description: 'For `call`: the operation called, such as `runActions`.'
          - type: "null"
        actor:
          $ref: '#/components/schemas/Actor'
        run:
          oneOf:
          - type: string
            maxLength: 100
            description: The `Kubi-Run` label the call carried.
          - type: "null"
        summary:
          type: string
          maxLength: 300
          description: For example `click (450, 280); type 15 chars; key enter`.
        params:
          oneOf:
          - type: object
            maxProperties: 50
            additionalProperties: true
            description: The call's parameters, typed text included; null when detailed history is off. Text that
