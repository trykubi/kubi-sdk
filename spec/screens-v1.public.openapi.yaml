      description: '401: where to find the authorization server (RFC 9728 metadata). 403 PERMISSION_DENIED: the
        missing scope.'
      schema:
        type: string
        maxLength: 300
      example: Bearer resource_metadata="https://api.trykubi.com/.well-known/oauth-protected-resource/v1"
