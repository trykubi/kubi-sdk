  /screens/{screen_id}/viewer:
    post:
      operationId: createViewer
      summary: Get a live-view link
      description: |-
        Needs the `read` permission. Answers within 2 s.

        A link to watch the screen live in a browser. Open it within 60 s; single use. API keys and apps get view-only links (to show a person what is happening) whose session ends after 60 minutes; a signed-in person gets an interactive one, where Take control turns on the mouse and keyboard. While a person has control, calls that look at or act on the screen get 409 CONTROL_HELD, and the person's input makes older screenshots stale. Revoking the credential that minted a link closes its session.
      tags:
      - Live view
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ScreenId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/Run'
