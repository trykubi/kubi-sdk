  /screens/{screen_id}/exec/{exec_id}:
    get:
      operationId: getExec
      summary: Get a command's status and output
      description: |-
        Needs the `exec` permission. Answers within 28 s.

        Status, exit code and output from byte offsets. With `wait_s`, `until=exit` (default) holds the reply until the command ends; `until=output` answers as soon as it prints (for live log views). Output keeps the last 1 MiB per stream for 24 h after exit.
      tags:
      - Commands
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ScreenId'
      - $ref: '#/components/parameters/ExecId'
      - $ref: '#/components/parameters/WaitS'
      - name: until
        in: query
        required: false
        description: 'What ends a long poll: `exit` (default) or `output`.'
        schema:
          type: string
          enum:
          - exit
          - output
          default: exit
          maxLength: 6
      - name: stdout_from
        in: query
        required: false
        description: Byte offset in stdout to read from (the last reply's stdout_bytes).
        schema:
          type: integer
          format: int64
          minimum: 0
          maximum: 1099511627776
          default: 0
      - name: stderr_from
        in: query
        required: false
        description: Byte offset in stderr to read from (the last reply's stderr_bytes).
        schema:
          type: integer
          format: int64
          minimum: 0
          maximum: 1099511627776
          default: 0
      - name: max_bytes
        in: query
        required: false
        description: Bytes of output per stream in this reply.
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 1048576
          default: 65536
      - name: tail
        in: query
        required: false
        description: 'true: the last max_bytes after the offset. false: the first.'
        schema:
          type: boolean
          default: false
      - $ref: '#/components/parameters/Run'
      responses:
        '200':
          description: Success.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            Billing-Warning:
              $ref: '#/components/headers/BillingWarning'
            Deprecation:
              $ref: '#/components/headers/Deprecation'
            Sunset:
