  /screens/{screen_id}/screenshot:
    get:
      operationId: getScreenshot
      summary: Take a screenshot
      description: |-
        Needs the `read` permission. Answers within 5 s.

        Captures the desktop now, scaled to 1280x720 by default, and returns JSON: base64 image plus its id, size and input_seq. Add `region` to zoom. For raw bytes (curl, `<img>`) use getScreenshotImage. A copy is saved in the screen's history unless detailed history is off; the reply itself is `Cache-Control: no-store`.
      tags:
      - Screenshots
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ScreenId'
      - name: size
        in: query
        required: false
        description: Image size, WIDTHxHEIGHT or `full`.
        schema:
          $ref: '#/components/schemas/ShotSize'
      - name: format
        in: query
        required: false
        description: png (default), webp or jpeg.
        schema:
          $ref: '#/components/schemas/ImageFormat'
      - name: quality
        in: query
        required: false
        description: webp and jpeg quality, 1 to 100.
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 80
      - name: max_bytes
        in: query
        required: false
        description: 'Cap on the encoded image: quality steps down, then the image shrinks.'
        schema:
          $ref: '#/components/schemas/MaxBytes'
      - name: region
        in: query
        required: false
        description: 'Zoom: `x0,y0,x1,y1` in the units of the screenshot named by `screenshot_id` (else 1280x720).
          Returned at full resolution.'
        schema:
          type: string
          maxLength: 19
          pattern: ^[0-9]{1,4},[0-9]{1,4},[0-9]{1,4},[0-9]{1,4}$
      - name: screenshot_id
        in: query
        required: false
        description: 'With `region`: the screenshot whose size the region is measured in.'
        schema:
          type: string
          maxLength: 25
          pattern: ^shot_[0-9a-z]{20}$
      - name: max_upscale
        in: query
        required: false
        description: 'With `region`: `fit` (default) or a number such as 2 to cap the upscale.'
        schema:
          type: string
          maxLength: 4
          pattern: ^(fit|[1-8](\.[0-9])?)$
          default: fit
      - name: cursor
        in: query
        required: false
        description: Draw the pointer.
        schema:
          type: boolean
          default: true
      - name: settle
