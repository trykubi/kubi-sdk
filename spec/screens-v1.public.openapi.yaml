  /screens/{screen_id}/actions:
    post:
      operationId: runActions
      summary: Run a batch of actions
      description: |-
        Needs the `control` permission. Answers within 28 s.

        Runs 1 to 20 input actions in order, 100 ms apart: click, move, drag, scroll, type, key, wait, settle, zoom and more. Stops at the first failure (status `partial`, later actions `not_executed`). With `screenshot: after` the reply carries the screen after the last action that ran, once it settles, so one call is one agent step.

        Coordinates are in `space`: by default the size of the screenshot named by `screenshot_id`, else 1280x720. Points outside are rejected, never clamped. With `screenshot_id`, nothing runs if any input ran after that shot (a person's in the live view included) or the screen restarted (409 STALE_OBSERVATION).

        Pointer actions take `element`, an id from getAccessibilityTree read for the same `screenshot_id`, in place of x and y; `set_value` and `invoke` act through accessibility and `focus` raises a window. `tree: after` attaches the tree after the batch, and `expect` checks up to 8 conditions after it (`expectation`: satisfied, unsatisfied or unknown).

        There is no lock between credentials: any credential with `control` may act at any time. Input on one screen runs one call at a time, in the order calls arrive, while commands run side by side. While a person has control of the screen, calls get 409 CONTROL_HELD; a person taking control mid-batch stops it at the next action (status `partial`, later actions `not_executed`). The optional `Kubi-Run` header groups calls into a run in the screen's history.

        Send an Idempotency-Key: after a lost reply, resend once with the same key. Within 10 minutes you get the stored per-action results and a fresh screenshot (`Idempotent-Replayed: true`), never a second click. If the screen restarted in between, 504 OUTCOME_UNKNOWN: look, never repeat blindly.
      tags:
      - Actions
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ScreenId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/Run'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionsRequest'
            examples:
              click:
                value:
                  actions:
                  - type: click
                    x: 450
                    "y": 280
                  screenshot_id: shot_01jb7q2x9k4m8q1w3z5t
                  screenshot: after
                summary: One click, look after
              batch:
                value:
                  actions:
                  - type: click
                    x: 640
                    "y": 52
                  - type: settle
                  - type: type
                    text: quarterly report
                    enter: true
                  space:
                  - 1280
                  - 720
                  screenshot: after
                  screenshot_options:
                    format: webp
                    max_bytes: 105000
                summary: 'Search: click, settle, type'
              gemini:
                value:
                  actions:
                  - type: click
                    x: 352
                    "y": 389
                  space:
                  - 1000
                  - 1000
                  screenshot: after
                summary: Gemini 0-999 grid
      responses:
        '200':
          description: Success.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
            Billing-Warning:
              $ref: '#/components/headers/BillingWarning'
            Deprecation:
              $ref: '#/components/headers/Deprecation'
            Sunset:
              $ref: '#/components/headers/Sunset'
          content:
