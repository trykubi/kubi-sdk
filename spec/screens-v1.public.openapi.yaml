  /screens/{screen_id}/accessibility:
    get:
      operationId: getAccessibilityTree
      summary: Read the accessibility tree
      description: |-
        Needs the `read` permission. Answers within 10 s.

        The elements of the active window (or `window`, or the part of it in `region`): role, name, value, states, the actions each offers and its place in the screenshot's pixels, as JSON and as text rows. Elements an agent can act on carry an id (`e12`) for `element`, `set_value` and `invoke` in runActions. The ids belong to `screenshot_id`: the one you send if it is still current, else a new one (no image is taken); any input after it makes them stale, as for a screenshot. A read stops at `max_elements` actionable elements or its time budget and says why in `truncated`. Text from apps is cleaned and cut, a password field's content is never read, and elements inside a web page are marked `web`, since the page wrote them. History records the read and its counts, never its text. A screen that can't read trees answers 409 UNSUPPORTED_CAPABILITY.
      tags:
      - Screenshots
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ScreenId'
      - name: window
        in: query
        required: false
        description: 'A window id from the window list. Default: the active window.'
        schema:
          $ref: '#/components/schemas/WindowId'
      - name: region
        in: query
        required: false
        description: "`x0,y0,x1,y1` in the screenshot's pixels: keep the elements there. A point is a 1x1 region.\
          \ Without `window`, the topmost window at the region's centre."
        schema:
          type: string
          maxLength: 19
          pattern: ^[0-9]{1,4},[0-9]{1,4},[0-9]{1,4},[0-9]{1,4}$
      - name: screenshot_id
        in: query
        required: false
        description: Bind the ids to this screenshot and give places in its pixels. 409 STALE_OBSERVATION if input
          ran since.
        schema:
          type: string
          maxLength: 25
          pattern: ^shot_[0-9a-z]{20}$
      - name: query
        in: query
        required: false
        description: Keep the elements whose role, name or value contains this (any of `a|b`), with their parents;
          ids stay the same.
        schema:
          type: string
          maxLength: 200
      - name: max_elements
        in: query
        required: false
        description: Actionable elements at most.
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000
          default: 250
      - name: budget_ms
