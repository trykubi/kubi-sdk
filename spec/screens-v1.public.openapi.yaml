    post:
      operationId: startExec
      summary: Run a command
      description: |-
        Needs the `exec` permission. Answers within 28 s.

        Starts a command on the screen. If it ends within `wait_s` (default 25) the reply is 200 with exit code and output (`max_bytes` and `tail` shape it). Otherwise 202 with the exec id: poll getExec. `timeout_s: 0` runs with no limit (dev servers, bots). The command keeps running if the connection drops; resend with the same Idempotency-Key and you get the same exec, never a second run.
      tags:
