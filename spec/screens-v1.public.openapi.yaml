                      app: org.gnome.TextEditor
                    windows_opened:
                    - title: Save As
                      app: org.gnome.TextEditor
                    screenshot:
                      screenshot_id: shot_01jb7q2x9k4m8q1w3z5t
                      mime_type: image/png
                      width: 1280
