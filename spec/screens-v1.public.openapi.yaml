    post:
      operationId: convertScreen
      summary: Switch a screen's kind
      description: |-
        Needs the `power` permission. Answers within 5 s.

        Makes a disposable screen persistent or a persistent one disposable, with no restart. To persistent: it joins the monthly subscription with the prorated price invoiced first (PAYMENT_REQUIRED if the card fails), its end time goes and metering stops. To disposable: it leaves the subscription (the unused days are credited to the next invoice) and draws on credit from now (CREDIT_EXHAUSTED with none). Already that kind: 202 with an operation that succeeds at once.
