tags:
- name: Screens
  description: Create, list, rename, power and delete screens.
- name: Operations
  description: Work that takes longer than one call.
- name: Templates
  description: Saved screens that new screens start from, in seconds.
- name: Snapshots
  description: Saved states of a screen's disk, and reset to one of them or to how the screen started.
- name: Screenshots
  description: 'See the screen: JSON with a base64 image, raw image bytes, or a zoomed region.'
- name: Actions
  description: Click, type, press keys, scroll, drag and move the pointer. One action per call, or a batch of up
    to 20 in one round trip.
- name: Commands
  description: Run shell commands. Short ones answer inline, long ones return an id to poll.
- name: Files
  description: Copy files to and from a screen, list folders.
- name: Clipboard
  description: Read and set the screen's clipboard text.
- name: Live view
  description: Watch a screen in a browser, or show it to a person.
- name: History
  description: Every call on a screen with the screenshot it returned, kept 30 days.
- name: Account
  description: Who is calling, limits, and the spec itself.
- name: Network
  description: Send a screen's traffic through your own proxy.
- name: Secrets
  description: Values kept in each screen's memory and put into every command's environment, never on its disk.
    The API never shows them.
