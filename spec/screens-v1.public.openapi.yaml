      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/Run'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecCreate'
            examples:
              short:
                value:
                  command: node --version
                summary: Short, answered inline
              long:
                value:
                  argv:
                  - npm
                  - ci
                  cwd: /home/user/app
                  timeout_s: 1800
                  wait_s: 25
                  max_bytes: 8192
                  tail: true
                summary: Long, returns an id
              server:
