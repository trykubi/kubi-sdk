          items:
            $ref: '#/components/schemas/FileEntry'
          maxItems: 1000
        next:
          oneOf:
          - type: string
            maxLength: 200
          - type: "null"
    ViewerCreate:
      type: object
      title: ViewerCreate
      properties:
        mode:
          type: string
          enum:
          - view
          - interactive
          default: view
          maxLength: 12
          description: interactive needs a person (cookie). Agents get view links.
      additionalProperties: false
    Viewer:
      type: object
      title: Viewer
      description: "`expires_at`: open the link by then. `session_expires_at`: the live session ends then (60 minutes\
        \ for agent-minted links). Revoking the credential that minted it closes it."
      required:
      - url
      - mode
      - expires_at
      - session_expires_at
      properties:
        url:
          type: string
          maxLength: 500
          format: uri
          description: Open within 60 s. Single use. The ticket rides in the URL fragment.
        mode:
          anyOf:
          - type: string
            enum:
            - view
            - interactive
            maxLength: 12
          - type: string
            maxLength: 12
        expires_at:
          type: string
          format: date-time
          maxLength: 40
        session_expires_at:
          type: string
          format: date-time
          maxLength: 40
    Actor:
