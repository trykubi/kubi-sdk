components:
  schemas:
    ErrorCode:
      anyOf:
      - type: string
        enum:
        - INVALID_ARGUMENT
        - COORDINATE_OUT_OF_RANGE
        - BATCH_TOO_LONG
        - UNAUTHENTICATED
        - QUOTA_EXCEEDED
        - PAYMENT_REQUIRED
        - CREDIT_EXHAUSTED
        - SUBSCRIPTION_REQUIRED
        - PERMISSION_DENIED
        - HUMAN_ONLY
        - CSRF_REJECTED
        - ORGANIZATION_SUSPENDED
        - ACCOUNT_PENDING
        - SCREEN_NOT_FOUND
        - NOT_FOUND
        - FILE_NOT_FOUND
        - NO_CAPACITY
        - STALE_OBSERVATION
        - CONTROL_HELD
        - SCREEN_NOT_RUNNING
        - OPERATION_IN_PROGRESS
        - IDEMPOTENCY_KEY_IN_USE
        - UNSUPPORTED_CAPABILITY
        - ELEMENT_NOT_FOUND
        - ELEMENT_GONE
        - ELEMENT_NOT_VISIBLE
        - PAYLOAD_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - IDEMPOTENCY_KEY_REUSED
        - SECRET_BLOCKED
        - URL_NOT_ALLOWED
        - RATE_LIMITED
        - INTERNAL
        - SCREEN_UNAVAILABLE
        - OUTCOME_UNKNOWN
        maxLength: 63
      - type: string
        maxLength: 63
      title: ErrorCode
      description: |-
        Stable machine code. The list can grow: treat an unknown code by its HTTP status.

        - `INVALID_ARGUMENT` (400): A field is missing, malformed or out of range (details.field, details.problem). Fix that field and resend.
        - `COORDINATE_OUT_OF_RANGE` (400): A point lies outside the coordinate space; it is rejected, never clamped. Use a point inside details.space.
        - `BATCH_TOO_LONG` (400): The batch would run past 28 s, inside the 30 s call limit. Split it into smaller batches.
        - `UNAUTHENTICATED` (401): The credential is missing, malformed, unknown, revoked or expired (details.reason). Send a valid key or token.
        - `QUOTA_EXCEEDED` (402): The organization is at its screen cap (details.screen_cap). Delete a screen, or a person asks support for a higher cap.
        - `PAYMENT_REQUIRED` (402): Payment failed. A person pays at details.pay_url.
        - `CREDIT_EXHAUSTED` (402): The usage credit that pays for disposable screens is used up (details.balance_usd). A person tops up at details.billing_url, or create a persistent screen.
        - `SUBSCRIPTION_REQUIRED` (402): Buying usage credit needs a paid persistent screen first. A person subscribes at details.billing_url.
        - `PERMISSION_DENIED` (403): The credential lacks details.needed, or is not bound to this screen. Use a credential that has it.
        - `HUMAN_ONLY` (403): Only a signed-in person (dashboard cookie) may call this. Ask a person to do it in the dashboard.
        - `CSRF_REJECTED` (403): A cookie request changed state without the dashboard's Origin. Send it from the dashboard, or use an API key.
        - `ORGANIZATION_SUSPENDED` (403): The organization is suspended. Stop and tell the user.
        - `ACCOUNT_PENDING` (403): The account is waiting for approval. Stop and tell the user.
        - `SCREEN_NOT_FOUND` (404): No such screen in your organization (the same answer for another organization's id). List screens for a valid id.
        - `NOT_FOUND` (404): No such operation, exec, key, app, export, template, snapshot or saved screenshot (saved ones go after 30 days). Check the id.
        - `FILE_NOT_FOUND` (404): Nothing at that path on the screen. List the folder with listFiles.
        - `NO_CAPACITY` (409): No free machine for a new screen right now; nothing was charged. Retry after retry_after.
        - `STALE_OBSERVATION` (409): Input ran (anyone's, a person's in the live view included) or the screen restarted since your screenshot (details.acted_since, details.restarted). Take a new screenshot first.
        - `CONTROL_HELD` (409): A person has control of this screen, so nothing ran. Control ends when they release it, or after 5 minutes with no input from them. Wait retry_after seconds, then take a new screenshot before acting.
        - `SCREEN_NOT_RUNNING` (409): The screen is stopped, starting or stopping. Start it, or wait on its operation.
        - `OPERATION_IN_PROGRESS` (409): Another power operation runs on this screen. Wait on it, then retry.
        - `IDEMPOTENCY_KEY_IN_USE` (409): A request with this key is still running. Retry the same request.
        - `UNSUPPORTED_CAPABILITY` (409): This screen cannot do that (for example a screenless box). Use a screen that can.
        - `ELEMENT_NOT_FOUND` (409): No element with that id in the tree read for this screenshot_id (details.element). Read the tree again and use its ids.
        - `ELEMENT_GONE` (409): The element is no longer there: its app closed it or rebuilt that part (details.element). Read the tree again.
        - `ELEMENT_NOT_VISIBLE` (409): The element has no place on the screen to press (scrolled away, or in a closed menu). Use `invoke` on it, or scroll and read the tree again.
        - `PAYLOAD_TOO_LARGE` (413): The body or file is over details.limit_bytes. Send less, or move big files through exec.
        - `UNSUPPORTED_MEDIA_TYPE` (415): Wrong Content-Type. Send application/json (application/octet-stream for file uploads).
        - `IDEMPOTENCY_KEY_REUSED` (422): This key was used with a different body. Use a new key.
        - `SECRET_BLOCKED` (422): The input contains one of our API keys; nothing was typed or run. Remove the key and resend.
        - `URL_NOT_ALLOWED` (422): The URL is not public HTTPS: it resolves to a private or reserved address, or redirects. Use a public HTTPS URL.
        - `RATE_LIMITED` (429): Too many requests. Wait retry_after seconds.
        - `INTERNAL` (500): Our bug. Retry with the same Idempotency-Key.
        - `SCREEN_UNAVAILABLE` (503): The screen's host or desktop is not answering. Retry after retry_after.
        - `OUTCOME_UNKNOWN` (504): The work may or may not have happened. Look before acting; never resend blindly.
    ErrorDetails:
      type: object
      title: ErrorDetails
      maxProperties: 30
      description: Code-specific facts. Every key is optional and new keys may appear (U6).
      properties:
        field:
          type: string
          maxLength: 200
          description: 'INVALID_ARGUMENT: the field at fault, as a path (`actions[0].y`).'
        problem:
          anyOf:
          - type: string
            enum:
            - required
            - unknown_field
            - malformed
            - too_long
            - out_of_range
            - conflict
            - private_address
            maxLength: 30
          - type: string
            maxLength: 30
          description: 'INVALID_ARGUMENT, URL_NOT_ALLOWED: what is wrong.'
        reason:
          anyOf:
          - type: string
            enum:
            - missing
            - malformed
            - unknown_key
            - revoked
            - expired
            maxLength: 20
          - type: string
            maxLength: 20
          description: 'UNAUTHENTICATED: why the credential failed.'
        needed:
          $ref: '#/components/schemas/Permission'
        has:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
          maxItems: 4
        acted_since:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
          description: 'STALE_OBSERVATION: input actions run since your screenshot.'
        restarted:
          type: boolean
          description: 'STALE_OBSERVATION: the screen restarted since your screenshot.'
        action_index:
          type: integer
          format: int32
          minimum: 0
          maximum: 19
        x:
          type: integer
          format: int32
          minimum: 0
          maximum: 99999
        "y":
          type: integer
          format: int32
          minimum: 0
          maximum: 99999
        element:
          type: string
          maxLength: 6
          description: 'ELEMENT_NOT_FOUND, ELEMENT_GONE, ELEMENT_NOT_VISIBLE: the element id.'
        space:
          type: array
          items:
            type: integer
            format: int32
            minimum: 1
            maximum: 9999
          maxItems: 2
          minItems: 2
        screenshot_size:
          type: array
          items:
            type: integer
            format: int32
            minimum: 1
            maximum: 9999
          maxItems: 2
          minItems: 2
        limit_bytes:
          type: integer
          format: int64
          minimum: 0
          maximum: 1099511627776
        screens:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000
          description: 'QUOTA_EXCEEDED: screens the organization has, running or stopped.'
        screen_cap:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000
          description: 'QUOTA_EXCEEDED: the most screens the organization may have.'
        snapshots:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          description: 'QUOTA_EXCEEDED on createSnapshot: the screen''s snapshots.'
        snapshot_cap:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          description: 'QUOTA_EXCEEDED on createSnapshot: the most a screen may keep.'
        min_usd:
          type: integer
          format: int32
          minimum: 0
          maximum: 100000
          description: 'INVALID_ARGUMENT on a top-up: the smallest allowed now.'
        max_usd:
          type: integer
          format: int32
          minimum: 0
          maximum: 100000
          description: 'INVALID_ARGUMENT on a top-up: the largest allowed now.'
        billing_url:
          type: string
          maxLength: 300
          format: uri
        pay_url:
          type: string
          maxLength: 2000
          format: uri
        stops_at:
          type: string
          format: date-time
          maxLength: 40
        balance_usd:
          type: number
          format: double
          minimum: 0
          maximum: 1000000
    ErrorBody:
      type: object
      title: ErrorBody
      description: The same shape for every error on every route.
      required:
      - code
      - message
      - request_id
      - retryable
      - outcome
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          maxLength: 1000
          description: One sentence for people and agents, ending with the fix. Do not parse it.
        request_id:
          type: string
          maxLength: 40
          pattern: ^req_[0-9a-z]{20}$
          description: Quote it in support requests.
        retryable:
          type: boolean
          description: True when the same request may succeed later. The SDK retries only these, never 504.
        retry_after:
          oneOf:
          - type: integer
            format: int32
            minimum: 0
            maximum: 86400
            description: Seconds to wait before trying again.
          - type: "null"
        outcome:
          anyOf:
          - type: string
            enum:
            - not_applied
            - unknown
            maxLength: 20
          - type: string
            maxLength: 20
          description: 'not_applied: nothing changed, so the reply is never stored for the Idempotency-Key. unknown:
            look before acting.'
        docs_url:
          type: string
          maxLength: 300
          format: uri
        details:
          $ref: '#/components/schemas/ErrorDetails'
    Error:
      type: object
      title: Error
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
    Permission:
      type: string
      enum:
      - read
      - control
      - exec
      - power
      maxLength: 10
      title: Permission
      description: 'read: see screens, screenshots and history. control: act on the GUI. exec: run commands, read,
        write and list files. power: create, start, stop, restart (and, for API keys, delete). Same names as OAuth
        scopes.'
    Coordinate:
      type: integer
      format: int32
      minimum: 0
      maximum: 9999
      description: Pixels in the request's coordinate space, origin top left.
      title: Coordinate
    Point:
      type: array
      items:
        $ref: '#/components/schemas/Coordinate'
      maxItems: 2
      minItems: 2
      title: Point
      description: '[x, y] in the coordinate space.'
    Space:
      type: array
      items:
        type: integer
        format: int32
        minimum: 1
        maximum: 9999
      maxItems: 2
      minItems: 2
      title: Space
      description: '[width, height] that coordinates are expressed in. Default: the size of the screenshot named
        by `screenshot_id`, else [1280, 720] (the default screenshot). Both sent and different: 400 INVALID_ARGUMENT
        with both sizes in details. Gemini sends [1000, 1000]. Each axis is scaled to the desktop separately.'
    Region:
      type: array
      items:
        $ref: '#/components/schemas/Coordinate'
      maxItems: 4
      minItems: 4
      title: Region
      description: '[x0, y0, x1, y1], top-left and bottom-right corners, in the coordinate space.'
    Labels:
      type: object
      title: Labels
      maxProperties: 20
      additionalProperties:
        type: string
        maxLength: 100
      propertyNames:
        pattern: ^[a-z0-9_.-]{1,40}$
        maxLength: 40
      description: Your own key-value tags. Filter lists with `label=key:value`.
    Size:
      type: object
      title: Size
      required:
      - width
      - height
      properties:
        width:
          type: integer
          format: int32
          minimum: 1
          maximum: 9999
        height:
          type: integer
          format: int32
          minimum: 1
          maximum: 9999
    MouseButton:
      type: string
      enum:
      - left
      - right
      - middle
      - back
      - forward
      default: left
      maxLength: 10
      title: MouseButton
    Modifiers:
      type: array
      items:
        type: string
        enum:
        - shift
        - ctrl
        - alt
        - super
        maxLength: 5
      maxItems: 4
      uniqueItems: true
      title: Modifiers
      description: Keys held during the action.
    ImageFormat:
      type: string
      enum:
      - png
      - webp
      - jpeg
      default: png
      maxLength: 4
      title: ImageFormat
      description: png by default (lossless, sharp text, no ICC chunk). webp at quality 80 is what the hosted MCP
        server sends, because it is smaller. jpeg is not recommended for UI text.
    ShotSize:
      type: string
      maxLength: 9
      pattern: ^([0-9]{2,4}x[0-9]{2,4}|full)$
      default: 1280x720
      title: ShotSize
      description: WIDTHxHEIGHT with the desktop's aspect ratio, or `full` (desktop size).
    MaxBytes:
      type: integer
      format: int32
      minimum: 1000
      maximum: 40000000
      title: MaxBytes
      description: Cap on the encoded image. webp and jpeg step quality 80, 70, 60, 50, then shrink; png only shrinks.
        The reply says the quality and size used. The hosted MCP sends 105000.
    MaxUpscale:
      title: MaxUpscale
      description: 'Zoom only. `fit` (default): scale the region to the usual shot size, as Anthropic does. A number
        caps the upscale (2 = at most twice the desktop pixels), which costs fewer image tokens.'
      default: fit
      oneOf:
      - type: string
        const: fit
        maxLength: 3
      - type: number
        format: double
        minimum: 1
        maximum: 8
    ScreenState:
      anyOf:
      - type: string
        enum:
        - provisioning
        - starting
        - running
        - stopping
        - stopped
        - restarting
        - deleting
        - deleted
        - failed
        maxLength: 20
      - type: string
        maxLength: 20
      title: ScreenState
      description: Power state. `failed` carries a state_reason. New values may appear.
    Health:
      type: object
      title: Health
      description: 'Each capability on its own: a running VM can have a broken display. Host unreachable means unknown.'
      required:
      - display
      - input
      - exec
      - viewer
      properties:
        display:
          anyOf:
          - type: string
            enum:
            - ok
            - degraded
            - down
            - unknown
            maxLength: 10
          - type: string
            maxLength: 10
        input:
          anyOf:
          - type: string
            enum:
            - ok
            - degraded
            - down
            - unknown
            maxLength: 10
          - type: string
            maxLength: 10
        exec:
          anyOf:
          - type: string
            enum:
            - ok
            - degraded
            - down
            - unknown
            maxLength: 10
          - type: string
            maxLength: 10
        viewer:
          anyOf:
          - type: string
            enum:
            - ok
            - degraded
            - down
            - unknown
            maxLength: 10
          - type: string
            maxLength: 10
        observed_at:
          oneOf:
          - type: string
            format: date-time
            maxLength: 40
          - type: "null"
    Resources:
      type: object
      title: Resources
      description: One size at launch. Resize comes later.
      required:
      - vcpu
      - memory_mb
      - disk_gb
      properties:
        vcpu:
          type: integer
          format: int32
          minimum: 1
          maximum: 64
        memory_mb:
          type: integer
          format: int32
          minimum: 512
          maximum: 262144
        disk_gb:
          type: integer
          format: int32
          minimum: 1
          maximum: 4096
    ControlState:
      type: object
      title: ControlState
      description: Whether a person has control of the screen.
      required:
      - held
      properties:
        held:
          type: boolean
          description: A person has control. Calls that look at or act on the screen get 409 CONTROL_HELD.
        since:
          oneOf:
          - type: string
            format: date-time
            maxLength: 40
          - type: "null"
        releases_at:
          oneOf:
          - type: string
            format: date-time
            maxLength: 40
            description: When control ends if the person does nothing more. Their input pushes it back.
          - type: "null"
    StateReason:
      anyOf:
      - type: string
        enum:
        - stopped_by_user
        - stopped_by_billing
        - stopped_by_admin
        - stopped_by_credit
        maxLength: 200
      - type: string
        maxLength: 200
      title: StateReason
      description: 'Why the screen is in its state. A stopped screen says who stopped it: `stopped_by_user` (a credential
        or a person in the organization), `stopped_by_billing` (the card''s retries ended; paying again starts it),
        `stopped_by_admin` (Kubi support) or `stopped_by_credit` (a disposable screen whose usage credit ran out;
        a top-up does not start it). A failed screen always carries a short code for what broke. New values may
        appear: show an unknown one as words.'
    ScreenColor:
      type: string
      enum:
      - green
      - lime
      - teal
      - cyan
      - blue
      - indigo
      - violet
      - pink
      - orange
      - amber
      maxLength: 10
      title: ScreenColor
      description: The colour of the screen's cube, shown beside its name in the dashboard. Only for people telling
        screens apart; nothing else reads it. A new screen is green unless its create says otherwise.
    ScreenKind:
      type: string
      enum:
      - persistent
      - disposable
      default: persistent
      maxLength: 12
      title: ScreenKind
      description: 'persistent: on the monthly subscription, one price per screen, running or stopped; kept until
        deleted, and a delete can be undone for 7 days. disposable: paid from usage credit for the time it runs,
        charged per billing step as each step starts; it can carry an end time, is deleted 7 days after it stops
        unless started again, and a delete is final.'
    ScreenSpend:
      type: object
      title: ScreenSpend
      description: What a disposable screen has cost so far.
      required:
      - running_s
      - charged_usd
      - since
      properties:
        running_s:
          type: integer
          format: int64
          minimum: 0
          maximum: 1099511627776
          description: Seconds it has run as a disposable screen.
        charged_usd:
          type: number
          format: double
          minimum: 0
          maximum: 1000000
          description: Credit charged for it so far, the step now running included.
        since:
          type: string
          format: date-time
          maxLength: 40
          description: When it became disposable (created or switched).
    Screen:
      type: object
      title: Screen
      required:
      - id
      - name
      - kind
      - color
      - labels
      - state
      - desktop
      - screenshot_default
      - image
      - size
      - resources
      - region
      - health
      - control
      - incarnation
      - created_at
      - updated_at
      properties:
        id:
          type: string
          pattern: ^scr_[0-9a-z]{20}$
          maxLength: 24
        name:
          type: string
          maxLength: 63
          pattern: ^[a-z0-9][a-z0-9-]{0,62}$
        kind:
          $ref: '#/components/schemas/ScreenKind'
        ends_at:
          oneOf:
          - type: string
            format: date-time
            maxLength: 40
            description: 'Disposable only: when it is deleted. null: no end time.'
          - type: "null"
        delete_after:
          oneOf:
          - type: string
            format: date-time
            maxLength: 40
            description: 'Disposable and stopped: when it is deleted unless started again or made persistent.'
          - type: "null"
        template_id:
          oneOf:
          - type: string
            pattern: ^tpl_[0-9a-z]{20}$
            maxLength: 24
            description: 'The template it started from; null: blank.'
          - type: "null"
        spend:
          oneOf:
          - $ref: '#/components/schemas/ScreenSpend'
            description: Disposable only; null for a persistent screen.
          - type: "null"
        created_by:
          oneOf:
          - $ref: '#/components/schemas/Actor'
            description: 'Who created it: the API key, app or person. Disposable screens are mostly made by agents,
              so lists show it.'
          - type: "null"
        color:
          anyOf:
          - type: string
            enum:
            - green
            - lime
            - teal
            - cyan
            - blue
            - indigo
            - violet
            - pink
            - orange
            - amber
            maxLength: 10
          - type: string
            maxLength: 10
          description: 'The cube''s colour (ScreenColor). New colours may appear: show an unknown one as green.'
        labels:
          $ref: '#/components/schemas/Labels'
        state:
          $ref: '#/components/schemas/ScreenState'
        state_reason:
          oneOf:
          - $ref: '#/components/schemas/StateReason'
          - type: "null"
        desktop:
          oneOf:
          - $ref: '#/components/schemas/Size'
            description: The desktop's size; null for an image with no desktop, which takes no screenshot or action.
          - type: "null"
        screenshot_default:
          oneOf:
          - $ref: '#/components/schemas/Size'
            description: A screenshot's size when none is asked for; null with no desktop.
          - type: "null"
        image:
          type: string
          maxLength: 63
          description: The image it was created from. One desktop image at launch.
        size:
          type: string
          maxLength: 20
          description: The size it was sold as (`standard`, the one size at launch); `resources` says what it has.
        resources:
          $ref: '#/components/schemas/Resources'
        region:
          type: string
          maxLength: 20
        health:
          $ref: '#/components/schemas/Health'
        control:
          $ref: '#/components/schemas/ControlState'
        viewers:
          type: integer
          format: int32
          minimum: 0
          maximum: 3
          description: Live views open on the screen right now, at most 3.
        incarnation:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
          description: Goes up when the machine restarts. Old screenshots and exec ids stop applying.
        operation_id:
          oneOf:
          - type: string
            pattern: ^op_[0-9a-z]{20}$
            maxLength: 23
          - type: "null"
        last_action_at:
          oneOf:
          - type: string
            format: date-time
            maxLength: 40
            description: When the last input call (click, type, key and the rest) ran.
          - type: "null"
        created_at:
          type: string
          format: date-time
          maxLength: 40
        updated_at:
          type: string
          format: date-time
          maxLength: 40
    ScreenCreate:
      type: object
      title: ScreenCreate
      properties:
        name:
          type: string
          maxLength: 63
          pattern: ^[a-z0-9][a-z0-9-]{0,62}$
          description: 'Unique in the organization. Default: generated.'
        color:
          $ref: '#/components/schemas/ScreenColor'
        labels:
          $ref: '#/components/schemas/Labels'
        kind:
          $ref: '#/components/schemas/ScreenKind'
        template_id:
          type: string
          pattern: ^tpl_[0-9a-z]{20}$
          maxLength: 24
          description: 'Start from this template. Default: blank.'
        size:
          type: string
          maxLength: 20
          pattern: ^[a-z0-9-]{1,20}$
          description: 'Default: `standard`, the one size at launch. A size not sold in the screen''s kind: INVALID_ARGUMENT.'
        ends_in_s:
          type: integer
          format: int32
          minimum: 300
          maximum: 2592000
          description: 'Disposable only: delete it this many seconds after it is created. Default: no end time.'
      additionalProperties: false
    ScreenUpdate:
      type: object
      title: ScreenUpdate
      description: Only the fields you send change. Labels replace the whole map.
      properties:
        name:
          type: string
          maxLength: 63
          pattern: ^[a-z0-9][a-z0-9-]{0,62}$
        color:
          $ref: '#/components/schemas/ScreenColor'
        labels:
          $ref: '#/components/schemas/Labels'
        ends_at:
          oneOf:
          - type: string
            format: date-time
            maxLength: 40
            description: 'Disposable only: set, move or (null) clear the end time. A persistent screen: 400.'
          - type: "null"
      additionalProperties: false
    ScreenList:
      type: object
      title: ScreenList
      required:
      - data
      - next
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Screen'
          maxItems: 100
        next:
          oneOf:
          - type: string
            maxLength: 200
          - type: "null"
    OperationKind:
      anyOf:
      - type: string
        enum:
        - screen.create
        - screen.start
        - screen.stop
        - screen.restart
        - screen.delete
        - screen.restore
        - screen.convert
        - template.create
        - screen.snapshot
        - screen.reset
        maxLength: 30
      - type: string
        maxLength: 30
      title: OperationKind
    ScreenConvert:
      type: object
      title: ScreenConvert
      description: The kind to switch to.
      required:
      - kind
      properties:
        kind:
          $ref: '#/components/schemas/ScreenKind'
      additionalProperties: false
    Template:
      type: object
      title: Template
      description: 'A saved screen to start new screens from: its disk, which holds what was installed on it, browser
        logins done by hand included. It never holds a secret: secrets are kept in the screen''s memory and never
        written to its disk, so no template can carry one.'
      required:
      - id
      - name
      - state
      - resources
      - with_memory
      - screens_started
      - created_at
      properties:
        id:
          type: string
          pattern: ^tpl_[0-9a-z]{20}$
          maxLength: 24
        name:
          type: string
          maxLength: 63
          pattern: ^[a-z0-9][a-z0-9-]{0,62}$
        state:
          anyOf:
          - type: string
            enum:
            - saving
            - ready
            - failed
            maxLength: 10
          - type: string
            maxLength: 10
          description: 'saving: being made from its screen.'
        source_screen_id:
          oneOf:
          - type: string
            pattern: ^scr_[0-9a-z]{20}$
            maxLength: 24
            description: The screen it was saved from; null once that screen is gone.
          - type: "null"
        resources:
          $ref: '#/components/schemas/Resources'
        with_memory:
          type: boolean
          description: 'true: a screen started from it comes back with the open windows it was saved with. false:
            it boots from the saved disk.'
        size_bytes:
          oneOf:
          - type: integer
            format: int64
            minimum: 0
            maximum: 1125899906842624
          - type: "null"
        screens_started:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
          description: Screens started from it so far.
        last_used_at:
          oneOf:
          - type: string
            format: date-time
            maxLength: 40
          - type: "null"
        created_at:
          type: string
          format: date-time
          maxLength: 40
    TemplateList:
      type: object
      title: TemplateList
      required:
      - data
      - next
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Template'
          maxItems: 100
        next:
          oneOf:
          - type: string
            maxLength: 200
          - type: "null"
    TemplateCreate:
      type: object
      title: TemplateCreate
      required:
      - screen_id
      - name
      properties:
        screen_id:
          type: string
          pattern: ^scr_[0-9a-z]{20}$
          maxLength: 24
        name:
          type: string
          maxLength: 63
          pattern: ^[a-z0-9][a-z0-9-]{0,62}$
          description: Unique among the organization's templates.
      additionalProperties: false
    Snapshot:
      type: object
      title: Snapshot
      description: 'A saved state of a screen''s disk to reset to. It holds the disk only: never the screen''s memory
        and never a secret.'
      required:
      - id
      - screen_id
      - name
      - state
      - size_bytes
      - created_at
      properties:
        id:
          type: string
          pattern: ^snap_[0-9a-z]{20}$
          maxLength: 25
        screen_id:
          type: string
          pattern: ^scr_[0-9a-z]{20}$
          maxLength: 24
        name:
          oneOf:
          - type: string
            maxLength: 63
            description: A label of your own; need not be unique.
          - type: "null"
        state:
          anyOf:
          - type: string
            enum:
            - creating
            - ready
            - failed
            maxLength: 10
          - type: string
            maxLength: 10
          description: 'creating: being taken.'
        size_bytes:
          oneOf:
          - type: integer
            format: int64
            minimum: 0
            maximum: 1125899906842624
            description: 'Space it holds now: the disk''s data changed since it was taken, which grows as the screen
              writes.'
          - type: "null"
        created_at:
          type: string
          format: date-time
          maxLength: 40
    SnapshotList:
      type: object
      title: SnapshotList
      required:
      - data
      - next
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Snapshot'
          maxItems: 3
        next:
          oneOf:
          - type: string
            maxLength: 200
          - type: "null"
    SnapshotCreate:
      type: object
      title: SnapshotCreate
      properties:
        name:
          type: string
          maxLength: 63
          description: Optional label.
      additionalProperties: false
    ResetRequest:
      type: object
      title: ResetRequest
      required:
      - snapshot_id
      properties:
        snapshot_id:
          oneOf:
          - type: string
            pattern: ^snap_[0-9a-z]{20}$
            maxLength: 25
            description: 'The snapshot to go back to; null: back to how the screen started.'
          - type: "null"
      additionalProperties: false
    Operation:
      type: object
      title: Operation
      description: Work that takes longer than one call. Kept 30 days.
      required:
      - id
      - kind
      - status
      - screen_id
      - created_at
      - updated_at
      properties:
        id:
          type: string
          pattern: ^op_[0-9a-z]{20}$
          maxLength: 23
        kind:
          $ref: '#/components/schemas/OperationKind'
        status:
          anyOf:
          - type: string
            enum:
            - queued
            - running
            - succeeded
            - failed
            - reconciling
            maxLength: 12
          - type: string
            maxLength: 12
          description: 'reconciling: the outcome is uncertain and we are checking the host. Not a failure; do not
            retry.'
        screen_id:
          type: string
          pattern: ^scr_[0-9a-z]{20}$
          maxLength: 24
        template_id:
          oneOf:
          - type: string
            pattern: ^tpl_[0-9a-z]{20}$
            maxLength: 24
            description: 'template.create: the template being saved.'
          - type: "null"
        snapshot_id:
          oneOf:
          - type: string
            pattern: ^snap_[0-9a-z]{20}$
            maxLength: 25
            description: 'screen.snapshot: the snapshot being taken. screen.reset: the one gone back to; null for
              a reset to the start.'
          - type: "null"
        error:
          oneOf:
          - $ref: '#/components/schemas/ErrorBody'
          - type: "null"
        progress:
          oneOf:
          - type: string
            maxLength: 100
            description: Current step in words, for example `booting`.
          - type: "null"
        created_at:
          type: string
          format: date-time
          maxLength: 40
        updated_at:
          type: string
          format: date-time
          maxLength: 40
        done_at:
          oneOf:
          - type: string
            format: date-time
            maxLength: 40
          - type: "null"
    OperationList:
      type: object
      title: OperationList
      required:
      - data
      - next
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Operation'
          maxItems: 100
        next:
          oneOf:
          - type: string
            maxLength: 200
          - type: "null"
    Screenshot:
      type: object
      title: Screenshot
      required:
      - screenshot_id
      - mime_type
      - width
      - height
      - screen_width
      - screen_height
      - captured_at
      - input_seq
      - size_bytes
      - data
      properties:
        screenshot_id:
          type: string
          maxLength: 25
          pattern: ^shot_[0-9a-z]{20}$
          description: Names one capture. Pass it to runActions (and to getScreenshot with `region`) so coordinates
            use its size and stale views are refused.
        mime_type:
          anyOf:
          - type: string
            enum:
            - image/png
            - image/webp
            - image/jpeg
            maxLength: 10
          - type: string
            maxLength: 10
        width:
          type: integer
          format: int32
          minimum: 1
          maximum: 9999
        height:
          type: integer
          format: int32
          minimum: 1
          maximum: 9999
        screen_width:
          type: integer
          format: int32
          minimum: 1
          maximum: 9999
        screen_height:
          type: integer
          format: int32
          minimum: 1
          maximum: 9999
        region:
          oneOf:
          - $ref: '#/components/schemas/Region'
          - type: "null"
        captured_at:
          type: string
          format: date-time
          maxLength: 40
        input_seq:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740992
          description: Input actions run on this screen before the capture. runActions with this screenshot_id refuses
            to run if it has moved on.
        settle_ms:
          oneOf:
          - type: integer
            format: int32
            minimum: 0
            maximum: 5000
            description: 'How long we waited for the screen to go quiet. null: no settle asked.'
          - type: "null"
        settled:
          oneOf:
          - type: boolean
            description: false when the settle cap was hit.
          - type: "null"
        quality:
          oneOf:
          - type: integer
            format: int32
            minimum: 1
            maximum: 100
            description: 'webp and jpeg: the quality used after max_bytes.'
          - type: "null"
        size_bytes:
          type: integer
          format: int32
          minimum: 0
          maximum: 40000000
          description: Encoded image size before base64.
        data:
          type: string
          maxLength: 40000000
          contentEncoding: base64
          description: The image, base64. A copy is saved in the screen's history unless detailed history is off.
        windows:
          type: array
          items:
            $ref: '#/components/schemas/WindowInfo'
          maxItems: 50
          description: 'With `windows=true`: the open windows, topmost first, in this screenshot''s pixels (a region''s:
            the full screenshot''s). Normal windows and dialogs only; at most 50.'
    WindowId:
      type: string
      maxLength: 12
      pattern: ^win_[0-9a-f]{1,8}$
      description: 'The window''s id while it is open: send it as `window` to read its tree or to `focus` it.'
      title: WindowId
    WindowRef:
      type: object
      title: WindowRef
      description: A window by its title and app, read from the window manager.
      required:
      - title
      - app
      properties:
        id:
          $ref: '#/components/schemas/WindowId'
        title:
          type: string
          maxLength: 200
          description: 'The window''s title, clipped to 200 characters. Read off the screen: history keeps the screenshot,
            never this text.'
        app:
          type: string
          maxLength: 100
          description: The app, from the window's class (for example `chromium`, `org.gnome.TextEditor`).
    WindowInfo:
      type: object
      title: WindowInfo
      description: One open window and its place, in the screenshot's pixels.
      required:
      - id
      - title
      - app
      - x
      - "y"
      - width
      - height
      - active
      properties:
        id:
          $ref: '#/components/schemas/WindowId'
        title:
          type: string
          maxLength: 200
          description: 'The window''s title, clipped to 200 characters. Read off the screen: history keeps the screenshot,
            never this text.'
        app:
          type: string
          maxLength: 100
          description: The app, from the window's class (for example `chromium`, `org.gnome.TextEditor`).
        x:
          type: integer
          format: int32
          minimum: -9999
          maximum: 9999
        "y":
          type: integer
          format: int32
          minimum: -9999
          maximum: 9999
        width:
          type: integer
          format: int32
          minimum: 0
          maximum: 9999
        height:
          type: integer
          format: int32
          minimum: 0
          maximum: 9999
        active:
          type: boolean
          description: true for the window with the keyboard focus.
    ScreenshotOptions:
      type: object
      title: ScreenshotOptions
      description: How the after-shot is taken.
      properties:
        size:
          $ref: '#/components/schemas/ShotSize'
        format:
          $ref: '#/components/schemas/ImageFormat'
        quality:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 80
          description: webp and jpeg only.
        max_bytes:
          $ref: '#/components/schemas/MaxBytes'
        cursor:
          type: boolean
          default: true
          description: Draw the pointer.
        settle_quiet_ms:
          type: integer
          format: int32
          minimum: 0
          maximum: 2000
          default: 300
          description: Wait until nothing changed for this long (pointer and caret-sized changes ignored).
        settle_max_ms:
          type: integer
          format: int32
          minimum: 0
          maximum: 5000
          default: 2000
          description: Then capture anyway.
      additionalProperties: false
    ElementId:
      type: string
      maxLength: 6
      pattern: ^e[0-9]{1,5}$
      description: 'An element id from the tree read for this batch''s `screenshot_id`, in place of x and y: aimed
        where the element is when the action runs.'
      title: ElementId
    ActionClick:
      type: object
      title: ActionClick
      description: 'Click. Without x and y: at the current pointer. count 2 = double, 3 = triple.'
      required:
      - type
      properties:
        type:
          type: string
          const: click
          maxLength: 20
        x:
          $ref: '#/components/schemas/Coordinate'
        "y":
          $ref: '#/components/schemas/Coordinate'
        element:
          $ref: '#/components/schemas/ElementId'
        button:
          $ref: '#/components/schemas/MouseButton'
        count:
          type: integer
          format: int32
          minimum: 1
          maximum: 3
          default: 1
        modifiers:
          $ref: '#/components/schemas/Modifiers'
      additionalProperties: false
    ActionMove:
      type: object
      title: ActionMove
      description: Move the pointer (hover), to x and y or to an element.
      required:
      - type
      properties:
        type:
          type: string
          const: move
          maxLength: 20
        x:
          $ref: '#/components/schemas/Coordinate'
        "y":
          $ref: '#/components/schemas/Coordinate'
        element:
          $ref: '#/components/schemas/ElementId'
      additionalProperties: false
    ActionMouseDown:
      type: object
      title: ActionMouseDown
      description: Press a button and hold it. Released by mouse_up, or after 30 s.
      required:
      - type
      properties:
        type:
          type: string
          const: mouse_down
          maxLength: 20
        x:
          $ref: '#/components/schemas/Coordinate'
        "y":
          $ref: '#/components/schemas/Coordinate'
        element:
          $ref: '#/components/schemas/ElementId'
        button:
          $ref: '#/components/schemas/MouseButton'
      additionalProperties: false
    ActionMouseUp:
      type: object
      title: ActionMouseUp
      description: Release a held button.
      required:
      - type
      properties:
        type:
          type: string
          const: mouse_up
          maxLength: 20
        x:
          $ref: '#/components/schemas/Coordinate'
        "y":
          $ref: '#/components/schemas/Coordinate'
        element:
          $ref: '#/components/schemas/ElementId'
        button:
          $ref: '#/components/schemas/MouseButton'
      additionalProperties: false
    ActionDrag:
      type: object
      title: ActionDrag
      description: Press at the first point, move through the rest, release at the last.
      required:
      - type
      - path
      properties:
        type:
          type: string
          const: drag
          maxLength: 20
        path:
          type: array
          items:
            $ref: '#/components/schemas/Point'
          maxItems: 100
          minItems: 2
        button:
          $ref: '#/components/schemas/MouseButton'
        modifiers:
          $ref: '#/components/schemas/Modifiers'
      additionalProperties: false
    ActionScroll:
      type: object
      title: ActionScroll
      description: Scroll at x, y (or the pointer). Positive dy scrolls down, positive dx right. One notch is one
        wheel click; px converts at 100 px per notch, at least 1.
      required:
      - type
      properties:
        type:
          type: string
          const: scroll
          maxLength: 20
        x:
          $ref: '#/components/schemas/Coordinate'
        "y":
          $ref: '#/components/schemas/Coordinate'
        element:
          $ref: '#/components/schemas/ElementId'
        dx:
          type: integer
          format: int32
          minimum: -10000
          maximum: 10000
          default: 0
        dy:
          type: integer
          format: int32
          minimum: -10000
          maximum: 10000
          default: 0
        unit:
          type: string
          enum:
          - notch
          - px
          default: notch
          maxLength: 5
        modifiers:
          $ref: '#/components/schemas/Modifiers'
      additionalProperties: false
    ActionType:
      type: object
      title: ActionType
      description: 'Type text as keystrokes, or paste it with `via: paste`. Up to 1,000 characters as keys and 100,000
        by paste; the result reports characters delivered.'
      required:
      - type
      - text
      properties:
        type:
          type: string
          const: type
          maxLength: 20
        text:
          type: string
          maxLength: 100000
          minLength: 1
        enter:
          type: boolean
          default: false
        delay_ms:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          default: 12
        via:
          type: string
          enum:
          - keys
          - paste
          default: keys
          maxLength: 5
          description: 'keys: keystrokes, up to 1,000 characters. paste: put the text on the clipboard and paste
            it (ctrl+v, or ctrl+shift+v in a terminal), up to 100,000 characters, for long text and characters the
            keyboard lacks. It leaves the text on the clipboard.'
      additionalProperties: false
    ActionKey:
      type: object
      title: ActionKey
      description: Press a key or chord. hold_ms holds it down (Anthropic hold_key).
      required:
      - type
      - keys
      properties:
        type:
          type: string
          const: key
          maxLength: 20
        keys:
          type: string
          maxLength: 100
          pattern: ^[A-Za-z0-9_+ -]{1,100}$
          description: 'A key or `+`-joined chord: `enter`, `ctrl+s`, `alt+tab`. xdotool names (`Return`), OpenAI''s
            upper-case names and Playwright names are accepted as aliases.'
        repeat:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 1
        hold_ms:
          type: integer
          format: int32
          minimum: 0
          maximum: 20000
          default: 0
      additionalProperties: false
    ActionKeyDown:
      type: object
      title: ActionKeyDown
      description: Press and hold. Released by key_up, or after 30 s.
      required:
      - type
      - keys
      properties:
        type:
          type: string
          const: key_down
          maxLength: 20
        keys:
          type: string
          maxLength: 100
          pattern: ^[A-Za-z0-9_+ -]{1,100}$
          description: 'A key or `+`-joined chord: `enter`, `ctrl+s`, `alt+tab`. xdotool names (`Return`), OpenAI''s
            upper-case names and Playwright names are accepted as aliases.'
      additionalProperties: false
    ActionKeyUp:
      type: object
      title: ActionKeyUp
      description: Release a held key.
      required:
      - type
      - keys
      properties:
        type:
          type: string
          const: key_up
          maxLength: 20
        keys:
          type: string
          maxLength: 100
          pattern: ^[A-Za-z0-9_+ -]{1,100}$
          description: 'A key or `+`-joined chord: `enter`, `ctrl+s`, `alt+tab`. xdotool names (`Return`), OpenAI''s
            upper-case names and Playwright names are accepted as aliases.'
      additionalProperties: false
    ActionWait:
      type: object
      title: ActionWait
      description: A timed pause inside the batch.
      required:
      - type
      - ms
      properties:
        type:
          type: string
          const: wait
          maxLength: 20
        ms:
          type: integer
          format: int32
          minimum: 0
          maximum: 20000
      additionalProperties: false
    ActionSettle:
      type: object
      title: ActionSettle
      description: Wait until the screen is quiet for quiet_ms (pointer and caret-sized changes ignored), at most
        max_ms. No image. Use it between a click and the next action, for example after opening a menu.
      required:
      - type
      properties:
        type:
          type: string
          const: settle
          maxLength: 20
        quiet_ms:
          type: integer
          format: int32
          minimum: 0
          maximum: 2000
          default: 300
        max_ms:
          type: integer
          format: int32
          minimum: 0
          maximum: 5000
          default: 2000
      additionalProperties: false
    ActionCursorPosition:
      type: object
      title: ActionCursorPosition
      description: Report the pointer position in the coordinate space.
      required:
      - type
      properties:
        type:
          type: string
          const: cursor_position
          maxLength: 20
      additionalProperties: false
    ActionSetValue:
      type: object
      title: ActionSetValue
      description: Set an element's text or number through accessibility, without the keyboard. The result reads
        it back in `value` (never for a password field).
      required:
      - type
      - element
      - value
      properties:
        type:
          type: string
          const: set_value
          maxLength: 20
        element:
          $ref: '#/components/schemas/ElementId'
        value:
          type: string
          maxLength: 10000
          description: The text, or a number for a slider or spin button.
      additionalProperties: false
    ActionInvoke:
      type: object
      title: ActionInvoke
      description: 'Run one of an element''s own actions through accessibility (click, activate, expand), with no
        pointer: it reaches elements scrolled away or in a closed menu.'
      required:
      - type
      - element
      properties:
        type:
          type: string
          const: invoke
          maxLength: 20
        element:
          $ref: '#/components/schemas/ElementId'
        action:
          type: string
          maxLength: 40
          description: 'One of the element''s `actions`. Default: its first.'
      additionalProperties: false
    ActionFocus:
      type: object
      title: ActionFocus
      description: Bring a window to the front and give it the keyboard.
      required:
      - type
      - window
      properties:
        type:
          type: string
          const: focus
          maxLength: 20
        window:
          $ref: '#/components/schemas/WindowId'
      additionalProperties: false
    ActionScreenshot:
      type: object
      title: ActionScreenshot
      description: Capture mid-batch (after settling). Counts toward 4 images per reply. The hosted MCP rejects
        it inside `act`.
      required:
      - type
      properties:
        type:
          type: string
          const: screenshot
          maxLength: 20
        size:
          $ref: '#/components/schemas/ShotSize'
        format:
          $ref: '#/components/schemas/ImageFormat'
        quality:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 80
        max_bytes:
          $ref: '#/components/schemas/MaxBytes'
        cursor:
          type: boolean
          default: true
      additionalProperties: false
    ActionZoom:
      type: object
      title: ActionZoom
      description: Capture a region at full resolution. Later points stay in full-screenshot space (Anthropic's
        rule). The hosted MCP rejects it inside `act`.
      required:
      - type
      - region
      properties:
        type:
          type: string
          const: zoom
          maxLength: 20
        region:
          $ref: '#/components/schemas/Region'
        format:
          $ref: '#/components/schemas/ImageFormat'
        quality:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 80
        max_bytes:
          $ref: '#/components/schemas/MaxBytes'
        max_upscale:
          $ref: '#/components/schemas/MaxUpscale'
      additionalProperties: false
    Action:
      title: Action
      description: One input step, picked by `type` (18 types). Covers Anthropic's 17 computer tools, OpenAI's computer
        actions and Gemini's desktop actions; the docs' model guide maps each one.
      oneOf:
      - $ref: '#/components/schemas/ActionClick'
      - $ref: '#/components/schemas/ActionMove'
      - $ref: '#/components/schemas/ActionMouseDown'
      - $ref: '#/components/schemas/ActionMouseUp'
      - $ref: '#/components/schemas/ActionDrag'
      - $ref: '#/components/schemas/ActionScroll'
      - $ref: '#/components/schemas/ActionType'
      - $ref: '#/components/schemas/ActionKey'
      - $ref: '#/components/schemas/ActionKeyDown'
      - $ref: '#/components/schemas/ActionKeyUp'
      - $ref: '#/components/schemas/ActionWait'
      - $ref: '#/components/schemas/ActionSettle'
      - $ref: '#/components/schemas/ActionCursorPosition'
      - $ref: '#/components/schemas/ActionSetValue'
      - $ref: '#/components/schemas/ActionInvoke'
      - $ref: '#/components/schemas/ActionFocus'
      - $ref: '#/components/schemas/ActionScreenshot'
      - $ref: '#/components/schemas/ActionZoom'
      discriminator:
        propertyName: type
        mapping:
          click: '#/components/schemas/ActionClick'
          move: '#/components/schemas/ActionMove'
          mouse_down: '#/components/schemas/ActionMouseDown'
          mouse_up: '#/components/schemas/ActionMouseUp'
          drag: '#/components/schemas/ActionDrag'
          scroll: '#/components/schemas/ActionScroll'
          type: '#/components/schemas/ActionType'
          key: '#/components/schemas/ActionKey'
          key_down: '#/components/schemas/ActionKeyDown'
          key_up: '#/components/schemas/ActionKeyUp'
          wait: '#/components/schemas/ActionWait'
          settle: '#/components/schemas/ActionSettle'
          cursor_position: '#/components/schemas/ActionCursorPosition'
          set_value: '#/components/schemas/ActionSetValue'
          invoke: '#/components/schemas/ActionInvoke'
          focus: '#/components/schemas/ActionFocus'
          screenshot: '#/components/schemas/ActionScreenshot'
          zoom: '#/components/schemas/ActionZoom'
    TreeElement:
      type: object
      title: TreeElement
      description: One element, its place in the coordinate space of the tree's screenshot_id.
      required:
      - id
      - role
      - name
      - states
      - depth
      - parent
      - web
      properties:
        id:
          oneOf:
          - type: string
            maxLength: 6
            description: Set on elements an agent can act on; act on it by this id.
          - type: "null"
        role:
          type: string
          maxLength: 40
          description: 'AT-SPI''s role name: `push button`, `entry`, `link`, `menu item`.'
        name:
          type: string
          maxLength: 1003
          description: 'Cleaned: control characters out, cut at 1,000 characters for prose (a paragraph, a text
            run, a heading, a cell) and 200 for any other element.'
        value:
          oneOf:
          - type: string
            maxLength: 2003
            description: Text in a field (cut at 500) or a number; a terminal's is the end of what it shows (its
              last 2,000 characters, the prompt included), on one line. Never a password field's.
          - type: "null"
        description:
          type: string
          maxLength: 203
        states:
          type: array
          items:
            type: string
            maxLength: 20
          maxItems: 14
          description: disabled, focused, checked, selected, pressed, expanded, collapsed, mixed, editable, read_only,
            required, invalid, modal.
        actions:
          type: array
          items:
            type: string
            maxLength: 40
          maxItems: 8
          description: What `invoke` can run on it.
        x:
          oneOf:
          - type: integer
            format: int32
            minimum: -9999
            maximum: 9999
          - type: "null"
        "y":
          oneOf:
          - type: integer
            format: int32
            minimum: -9999
            maximum: 9999
          - type: "null"
        width:
          oneOf:
          - type: integer
            format: int32
            minimum: 0
            maximum: 9999
          - type: "null"
        height:
          oneOf:
          - type: integer
            format: int32
            minimum: 0
            maximum: 9999
          - type: "null"
        depth:
          type: integer
          format: int32
          minimum: 0
          maximum: 64
        parent:
          oneOf:
          - type: integer
            format: int32
            minimum: 0
            maximum: 4000
            description: Index of the parent element in `elements`.
          - type: "null"
        web:
          type: boolean
          description: 'Inside a web page: the page wrote its text.'
        offscreen:
          type: boolean
          description: Outside the window's view; `invoke` still reaches it.
        closed_items:
          type: integer
          format: int32
          minimum: 0
          maximum: 100000
          description: 'A closed menu: how many items it holds, not listed.'
        unlisted_children:
          type: integer
          format: int32
          minimum: 0
          maximum: 10000000
          description: 'A container too big to open: its children, not listed.'
        note:
          type: string
          maxLength: 120
          description: 'For a control with no name: which of its kind it is.'
    AccessibilityTree:
      type: object
      title: AccessibilityTree
      required:
      - screenshot_id
      - space
      - windows
      - elements
      - complete
      - truncated
      - read_ms
      properties:
        screenshot_id:
          type: string
          maxLength: 25
          pattern: ^shot_[0-9a-z]{20}$
          description: Names one capture. Pass it to runActions (and to getScreenshot with `region`) so coordinates
            use its size and stale views are refused.
        space:
          $ref: '#/components/schemas/Space'
        window:
          oneOf:
          - $ref: '#/components/schemas/WindowInfo'
          - type: "null"
        windows:
          type: array
          items:
            $ref: '#/components/schemas/WindowInfo'
          maxItems: 50
          description: The open windows, topmost first, as on a screenshot.
        app:
          type: string
          maxLength: 200
        window_scoped:
          type: boolean
          description: 'false: the app''s window could not be told apart, so every window of the app is listed.'
        elements:
          type: array
          items:
            $ref: '#/components/schemas/TreeElement'
          maxItems: 4000
        text:
          type: string
          maxLength: 600000
          description: 'The same elements as text rows for a model: `[e12] push button "Save" @880,40 60x30 (disabled)`,
            indented by depth. Quotes in app text are escaped.'
        complete:
          type: boolean
          description: 'true: every element of the window was read.'
        truncated:
          oneOf:
          - type: object
            title: TreeTruncation
            description: Why the read stopped early. Narrow it by window, region or query.
            required:
            - reason
            - listed
            - left
            properties:
              reason:
                anyOf:
                - type: string
                  enum:
                  - timeout
                  - element_cap
                  - row_cap
                  - app_unresponsive
                  - size_cap
                  maxLength: 20
                - type: string
                  maxLength: 20
              listed:
                type: integer
                format: int32
                minimum: 0
                maximum: 4000
              left:
                type: integer
                format: int32
                minimum: 0
                maximum: 10000000
          - type: "null"
        read_ms:
          type: integer
          format: int32
          minimum: 0
          maximum: 30000
    TreeOptions:
      type: object
      title: TreeOptions
      description: How the tree after a batch is read.
      properties:
        max_elements:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000
          default: 250
        query:
          type: string
          maxLength: 200
        format:
          type: string
          enum:
          - both
          - text
          - elements
          default: both
          maxLength: 8
      additionalProperties: false
    Condition:
      type: object
      title: Condition
      description: 'One check: on an element (`element` plus one or more of the rest) or on the active window (`window_title`).'
      properties:
        element:
          $ref: '#/components/schemas/ElementId'
        window_title:
          type: string
          maxLength: 200
          description: The active window's title contains this.
        value:
          type: string
          maxLength: 503
          description: The element's value equals this.
        value_contains:
          type: string
          maxLength: 503
        name_contains:
          type: string
          maxLength: 203
        enabled:
          type: boolean
        selected:
          type: boolean
        checked:
          type: boolean
        focused:
          type: boolean
      additionalProperties: false
    Expect:
      type: object
      title: Expect
      description: Checked after the batch, every 100 ms until two reads agree.
      required:
      - conditions
      properties:
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/Condition'
          maxItems: 8
          minItems: 1
          description: All must hold.
        timeout_ms:
          type: integer
          format: int32
          minimum: 0
          maximum: 10000
          default: 2000
      additionalProperties: false
    Expectation:
      type: object
      title: Expectation
      required:
      - result
      - conditions
      - waited_ms
      properties:
        result:
          anyOf:
          - type: string
            enum:
            - satisfied
            - unsatisfied
            - unknown
            maxLength: 12
          - type: string
            maxLength: 12
          description: 'unknown: it couldn''t be told (an element gone, the reader not answering); never read it
            as success.'
        reason:
          type: string
          maxLength: 200
        conditions:
          type: array
          items:
            type: object
            title: ConditionResult
            required:
            - index
            - result
            properties:
              index:
                type: integer
                format: int32
                minimum: 0
                maximum: 7
              result:
                anyOf:
                - type: string
                  enum:
                  - satisfied
                  - unsatisfied
                  - unknown
                  maxLength: 12
                - type: string
                  maxLength: 12
              observed:
                oneOf:
                - type: string
                  maxLength: 503
                - type: "null"
          maxItems: 8
        waited_ms:
          type: integer
          format: int32
          minimum: 0
          maximum: 10000
    ActionsRequest:
      type: object
      title: ActionsRequest
      required:
      - actions
      properties:
        actions:
          type: array
          items:
            $ref: '#/components/schemas/Action'
          maxItems: 20
          minItems: 1
          description: Run in order, 100 ms apart. Stops at the first failure; the rest are `not_executed`. The
            whole batch must fit in 28 s.
        space:
          $ref: '#/components/schemas/Space'
        screenshot_id:
          type: string
          maxLength: 25
          pattern: ^shot_[0-9a-z]{20}$
          description: 'Optional precondition and coordinate default: the screenshot you acted on. If any input
            ran after it (a person''s in the live view included) or the screen restarted, nothing runs: 409 STALE_OBSERVATION.
            The hosted MCP always sends it.'
        screenshot:
          type: string
          enum:
          - after
          - if_changed
          - none
          default: none
          maxLength: 10
          description: 'after: attach the screen after the last action that ran, once it settles. if_changed: only
            if it changed visibly since `screenshot_id` (else `screenshot_unchanged: true`). none: no image. The
            hosted MCP sends `after`.'
        screenshot_options:
          $ref: '#/components/schemas/ScreenshotOptions'
        tree:
          type: string
          enum:
          - after
          - none
          default: none
          maxLength: 5
          description: 'after: attach an accessibility tree after the batch, bound to the after-screenshot''s id
            (or a new one), so its ids are ready for the next call. It reads the window of the last action by element
            while that window is open, else the active window.'
        tree_options:
          $ref: '#/components/schemas/TreeOptions'
        expect:
          $ref: '#/components/schemas/Expect'
      additionalProperties: false
    ActionResult:
      type: object
      title: ActionResult
      description: Fields that do not apply are left out, never null.
      required:
      - index
      - type
      - status
      - duration_ms
      properties:
        index:
          type: integer
          format: int32
          minimum: 0
          maximum: 19
        type:
          type: string
          maxLength: 20
        status:
          anyOf:
          - type: string
            enum:
            - ok
            - failed
            - not_executed
            maxLength: 12
          - type: string
            maxLength: 12
        error:
          $ref: '#/components/schemas/ErrorBody'
        cursor:
          $ref: '#/components/schemas/Point'
        typed_chars:
          type: integer
          format: int32
          minimum: 0
          maximum: 100000
        screen_changed:
          type: boolean
          description: 'Input actions only: whether anything visible changed after it (pointer and caret-sized changes
            ignored), watched until the next action, or up to 500 ms after the last one. false means no visible
            change, not failure: look again before repeating it.'
        window:
          $ref: '#/components/schemas/WindowRef'
          description: 'Input actions only: the topmost window under the point for a pointer action, else the active
            window that got the keys.'
        screenshot:
          $ref: '#/components/schemas/Screenshot'
        element:
          $ref: '#/components/schemas/ElementId'
        value:
          oneOf:
          - type: string
            maxLength: 503
            description: 'set_value: the value read back; null when it can''t be read.'
          - type: "null"
        invoked:
          type: string
          maxLength: 40
          description: 'invoke: the action run.'
        duration_ms:
          type: integer
          format: int32
          minimum: 0
          maximum: 30000
    ActionsResponse:
      type: object
      title: ActionsResponse
      required:
      - status
      - results
      - space
      properties:
        status:
          anyOf:
          - type: string
            enum:
            - completed
            - partial
            maxLength: 10
          - type: string
            maxLength: 10
          description: 'partial: an action failed; see results. The after-screenshot is still attached.'
        results:
          type: array
          items:
            $ref: '#/components/schemas/ActionResult'
          maxItems: 20
        screenshot:
          oneOf:
          - $ref: '#/components/schemas/Screenshot'
          - type: "null"
        screenshot_unchanged:
          type: boolean
          description: if_changed found no visible change.
        active_window:
          $ref: '#/components/schemas/WindowRef'
          description: The window with the keyboard focus after the batch. Left out when there is none.
        windows_opened:
          type: array
          items:
            $ref: '#/components/schemas/WindowRef'
          maxItems: 20
          description: Windows that opened during the batch, newest first. Left out when none did.
        tree:
          $ref: '#/components/schemas/AccessibilityTree'
        expectation:
          $ref: '#/components/schemas/Expectation'
        space:
          $ref: '#/components/schemas/Space'
    ExecCreate:
      type: object
      title: ExecCreate
      properties:
        command:
          type: string
          maxLength: 10000
          description: Shell command, run with `bash -lc` as the desktop user. Send this or argv.
        argv:
          type: array
          items:
            type: string
            maxLength: 4000
          maxItems: 200
          minItems: 1
          description: Program and arguments, no shell. Send this or command.
        cwd:
          type: string
          maxLength: 1024
          default: /home/user
        env:
          type: object
          maxProperties: 50
          additionalProperties:
            type: string
            maxLength: 4000
          propertyNames:
            pattern: ^[A-Za-z_][A-Za-z0-9_]{0,63}$
            maxLength: 64
        stdin:
          type: string
          maxLength: 65536
          description: Written to stdin, then closed.
        timeout_s:
          type: integer
          format: int32
          minimum: 0
          maximum: 86400
          default: 3600
          description: '0: no limit (dev servers, bots). At the limit we send TERM, then KILL after 10 s; status
            `timed_out`. Runs on after the call returns.'
        wait_s:
          type: integer
          format: int32
          minimum: 0
          maximum: 25
          default: 25
          description: Answer inline if done within this; else 202 and an id to poll.
        max_bytes:
          type: integer
          format: int32
          minimum: 1
          maximum: 1048576
          default: 65536
          description: Bytes of output per stream in this reply.
        tail:
          type: boolean
          default: false
          description: 'true: the last max_bytes after the offset (errors and exit lines). false: the first.'
      additionalProperties: false
    Exec:
      type: object
      title: Exec
      required:
      - id
      - screen_id
      - status
      - started_at
      - stdout
      - stderr
      - stdout_bytes
      - stderr_bytes
      - incarnation
      properties:
        id:
          type: string
          pattern: ^ex_[0-9a-z]{20}$
          maxLength: 23
        screen_id:
          type: string
          pattern: ^scr_[0-9a-z]{20}$
          maxLength: 24
        status:
          anyOf:
          - type: string
            enum:
            - running
            - exited
            - killed
            - timed_out
            - lost
            maxLength: 10
          - type: string
            maxLength: 10
          description: 'lost: the screen restarted mid-run; the exit status is unknown. Never rerun blindly.'
        exit_code:
          oneOf:
          - type: integer
            format: int32
            minimum: 0
            maximum: 255
          - type: "null"
        signal:
          oneOf:
          - type: string
            maxLength: 10
          - type: "null"
        started_at:
          type: string
          format: date-time
          maxLength: 40
        ended_at:
          oneOf:
          - type: string
            format: date-time
            maxLength: 40
          - type: "null"
        duration_ms:
          oneOf:
          - type: integer
            format: int64
            minimum: 0
            maximum: 1099511627776
          - type: "null"
        stdout:
          type: string
          maxLength: 1048576
          description: Output from `stdout_from`, up to max_bytes (head or tail). UTF-8, invalid bytes replaced.
        stderr:
          type: string
          maxLength: 1048576
        stdout_bytes:
          type: integer
          format: int64
          minimum: 0
          maximum: 1099511627776
          description: Total bytes written so far. Use as the next stdout_from.
        stderr_bytes:
          type: integer
          format: int64
          minimum: 0
          maximum: 1099511627776
        output_dropped:
          type: boolean
          description: Older output fell out of the 1 MiB per-stream buffer.
        incarnation:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
    ExecKill:
      type: object
      title: ExecKill
      properties:
        signal:
          type: string
          enum:
          - TERM
          - INT
          - KILL
          default: TERM
          maxLength: 4
      additionalProperties: false
    FileWritten:
      type: object
      title: FileWritten
      required:
      - path
      - size_bytes
      - sha256
      properties:
        path:
          type: string
          maxLength: 1024
        size_bytes:
          type: integer
          format: int32
          minimum: 0
          maximum: 67108864
        sha256:
          type: string
          maxLength: 64
          pattern: ^[0-9a-f]{64}$
    FileEntry:
      type: object
      title: FileEntry
      required:
      - name
      - type
      - size_bytes
      - modified_at
      properties:
        name:
          type: string
          maxLength: 255
        type:
          anyOf:
          - type: string
            enum:
            - file
            - dir
            - symlink
            - other
            maxLength: 10
          - type: string
            maxLength: 10
        size_bytes:
          type: integer
          format: int64
          minimum: 0
          maximum: 1125899906842624
        modified_at:
          type: string
          format: date-time
          maxLength: 40
    Clipboard:
      type: object
      title: Clipboard
      required:
      - text
      - truncated
      properties:
        text:
          type: string
          maxLength: 100000
          description: The clipboard's text; empty when it holds none or holds no text.
        truncated:
          type: boolean
          description: true when the clipboard held more than 100,000 characters and only the first came back.
