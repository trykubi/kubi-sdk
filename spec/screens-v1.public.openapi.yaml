                      region: null
                      captured_at: '2026-10-22T09:14:07Z'
                      input_seq: 41
                      settle_ms: 320
                      settled: true
                      quality: null
                      size_bytes: 241664
                      data: iVBORw0KGgoAAAANSUhEUgAABQAAAALQCAIAAAD...
        '400':
