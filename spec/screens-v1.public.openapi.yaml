  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 'Any unique string, ideally a UUIDv7; the SDK and MCP always send one. A retry with the same
        key and body gets the stored answer instead of running twice (kept 24 h for screens and power, 10 minutes
        for actions and commands). Stored once execution began: 2xx, 500 and 504. Never stored when `outcome` is
        `not_applied` (400, 401, 403, 404, 409, 415, 422, 429), so the same key can be retried after a conflict
        or a rate limit. Replays of runActions keep per-action results and shot metadata only, capture a fresh screenshot
        and carry `Idempotent-Replayed: true`. Same key, different body: 422 IDEMPOTENCY_KEY_REUSED. Same key still
        running: 409 IDEMPOTENCY_KEY_IN_USE.'
      schema:
        type: string
        maxLength: 255
        minLength: 8
        pattern: ^[ -~]+$
      example: 01929f6e-7c1a-7b3e-9d2f-5a8c4e6b1d03
    Limit:
      name: limit
      in: query
      required: false
      description: Page size, 1 to 100.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
    After:
      name: after
      in: query
      required: false
      description: Opaque cursor from the previous page's `next`.
      schema:
        type: string
        maxLength: 200
        pattern: ^[A-Za-z0-9_-]+$
    WaitS:
      name: wait_s
      in: query
      required: false
      description: 'Long poll: hold the reply up to this many seconds until something changes. 0 answers at once.
        Capped at 25 so every call ends within 30 s.'
      schema:
        type: integer
        format: int32
        minimum: 0
        maximum: 25
        default: 0
    ScreenId:
      name: screen_id
      in: path
      required: true
      description: Screen id (`scr_...`).
      schema:
        type: string
        pattern: ^scr_[0-9a-z]{20}$
        maxLength: 24
      example: scr_7f2kq9w3x8m4b6tzp1ac
    OperationId:
      name: operation_id
      in: path
      required: true
      description: Operation id (`op_...`).
      schema:
        type: string
        pattern: ^op_[0-9a-z]{20}$
        maxLength: 23
      example: op_01jb7q0x9v2k8m4n6p3r
    TemplateId:
      name: template_id
      in: path
      required: true
      description: Template id (`tpl_...`).
      schema:
        type: string
        pattern: ^tpl_[0-9a-z]{20}$
        maxLength: 24
      example: tpl_01jb9a2m5k8q3w9x4z6t
    SnapshotId:
      name: snapshot_id
      in: path
      required: true
      description: Snapshot id (`snap_...`).
      schema:
        type: string
        pattern: ^snap_[0-9a-z]{20}$
        maxLength: 25
      example: snap_01jb8a2m5k8q3w9x4z6t
    ExecId:
      name: exec_id
      in: path
      required: true
      description: Exec id (`ex_...`) from startExec.
      schema:
        type: string
        pattern: ^ex_[0-9a-z]{20}$
        maxLength: 23
      example: ex_01jb7r2m5k8q3w9x4z6t
    FilePath:
      name: path
      in: query
      required: true
      description: Absolute path on the screen, or relative to /home/user.
      schema:
        type: string
        maxLength: 1024
        minLength: 1
      example: /home/user/report.pdf
    ScreenshotId:
      name: screenshot_id
      in: path
      required: true
      description: Saved screenshot id (`shot_...`), from a reply or a history row.
      schema:
        type: string
        maxLength: 25
        pattern: ^shot_[0-9a-z]{20}$
      example: shot_01jb7q2x9k4m8q1w3z5t
    Run:
      name: Kubi-Run
      in: header
      required: false
      description: Optional label that groups calls into one run in the screen's history. It is only a label and
        never locks the screen. The SDK fills it from KUBI_RUN, else Claude Code's CLAUDE_CODE_SESSION_ID, else
        one id per client it creates.
      schema:
        type: string
        maxLength: 100
        pattern: ^[ -~]{1,100}$
      example: 6f1c2a90-3d4b-4e8f-9a1c-7b2d5e8f0a13
  headers:
    RequestId:
      description: Id of this request (also in error bodies and the screen's history).
      schema:
        type: string
        maxLength: 40
        pattern: ^req_[0-9a-z]{20}$
    RateLimit:
      description: 'Informative: remaining requests and seconds to reset (IETF draft). Retry-After on 429 is the
        contract.'
      schema:
        type: string
        maxLength: 100
      example: '"default";r=287;t=41'
    RateLimitPolicy:
      description: 'Informative: the quota and window that apply. Per credential: 60 a minute per screen in the
        organization, at least 300. Per screen: 2 image calls and 10 other calls a second.'
      schema:
        type: string
        maxLength: 100
      example: '"default";q=300;w=60'
    RetryAfter:
      description: Seconds to wait before retrying or polling.
      schema:
        type: integer
        format: int32
        minimum: 0
        maximum: 86400
    IdempotentReplayed:
      description: true when this answer replays an earlier request with the same key.
      schema:
        type: string
        enum:
        - "true"
        maxLength: 4
