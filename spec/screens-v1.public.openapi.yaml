            -H "Idempotency-Key: $(uuidgen)" \
            -H 'Content-Type: application/json' \
            -d '{"mode": "view"}'
      - lang: TypeScript
        label: TypeScript SDK
        source: |-
          import { Kubi } from "@trykubi/sdk";
          const client = new Kubi(); // reads KUBI_API_KEY
          const { url } = await client.screen("scr_7f2kq9w3x8m4b6tzp1ac").viewerLink();
    get:
      operationId: openViewer
      summary: Open the live view (WebSocket)
      description: |-
        No key needed. Answers within 5 s.

        The stream a live-view link's page opens: a WebSocket carrying VNC (RFB 3.8) frames, for noVNC or any RFB client. The link's ticket (`vt_...`, from the `#t=` part of its URL) is the credential: send `Sec-WebSocket-Protocol: kubi.v1, <ticket>`, never the ticket in the URL. The reply picks `kubi.v1`. A ticket opens one socket, within 60 s of its link being made. View-only sessions drop keyboard, mouse and clipboard; an interactive one passes them only while its person holds the screen. At most 3 live views per screen. The socket closes when the session ends, the screen stops or restarts, or the credential that made the link is revoked.
      tags:
      - Live view
      security: []
      parameters:
      - $ref: '#/components/parameters/ScreenId'
      - name: Sec-WebSocket-Protocol
        in: header
        required: true
        description: "`kubi.v1` and the link's ticket, comma separated."
        schema:
          type: string
          maxLength: 64
          pattern: ^kubi\.v1, ?vt_[A-Za-z0-9_-]{20}$
        example: kubi.v1, vt_4Hq8mZ2kP9xW3nR7bT5c
      responses:
        '101':
          description: Switching protocols to the WebSocket.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: 'Bad request: INVALID_ARGUMENT.'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: 'Not authenticated: UNAUTHENTICATED.'
        '404':
          $ref: '#/components/responses/NotFound'
          description: 'Not found: SCREEN_NOT_FOUND.'
        '409':
          $ref: '#/components/responses/Conflict'
          description: 'Conflict with the screen''s state: SCREEN_NOT_RUNNING.'
        '429':
          $ref: '#/components/responses/TooManyRequests'
          description: 'Rate limited: RATE_LIMITED.'
        '503':
          $ref: '#/components/responses/Unavailable'
          description: 'Screen unavailable: SCREEN_UNAVAILABLE.'
      x-codeSamples:
      - lang: JavaScript
        label: Browser (noVNC)
        source: |-
          import RFB from "@novnc/novnc";
          const ticket = new URLSearchParams(new URL(viewer.url).hash.slice(1)).get("t");
          const rfb = new RFB(el, "wss://api.trykubi.com/v1/screens/scr_7f2kq9w3x8m4b6tzp1ac/viewer", { wsProtocols: ["kubi.v1", ticket] });
          rfb.viewOnly = true;
  /screens/{screen_id}/history:
    get:
      operationId: listHistory
      summary: Read the screen's history
      description: |-
        Needs the `read` permission. Answers within 28 s.

        Every call made on the screen, newest first: what was called, its parameters and typed text, which key or app called it, its run label, the result, how long it took and the screenshot it returned. Changes to the screen are rows too. Kept 30 days. With detailed history off, rows keep only what was called, by whom, when and the result. The live view is never recorded, and typed text that matches an organization secret is replaced. Rows are written after the reply, never on the call's path. To follow live, pass `since` (a row id) with `wait_s` and get newer rows oldest first.
      tags:
      - History
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ScreenId'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/After'
      - $ref: '#/components/parameters/WaitS'
      - name: since
        in: query
        required: false
        description: 'Follow mode: return rows newer than this id, oldest first.'
        schema:
          type: string
          maxLength: 30
          pattern: ^evt_[0-9a-z]{20}$
      - name: run
        in: query
        required: false
        description: Only rows with this `Kubi-Run` label.
        schema:
          type: string
          maxLength: 100
      - name: actor
        in: query
        required: false
        description: Only rows by this kind of actor.
        schema:
          type: string
          enum:
          - api_key
          - app
          - person
          - system
          maxLength: 10
      - name: errors_only
        in: query
        required: false
        description: Only rows whose result is an error.
        schema:
          type: boolean
          default: false
      - $ref: '#/components/parameters/Run'
      responses:
        '200':
          description: Success.
          headers:
            Request-Id:
              $ref: '#/components/headers/RequestId'
            RateLimit:
