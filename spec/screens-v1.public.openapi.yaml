                    mode: view
                    expires_at: '2026-10-22T09:15:07Z'
                    session_expires_at: '2026-10-22T10:15:07Z'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: 'Bad request: INVALID_ARGUMENT.'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: 'Not authenticated: UNAUTHENTICATED.'
        '403':
          $ref: '#/components/responses/Forbidden'
          description: 'Not allowed: PERMISSION_DENIED, HUMAN_ONLY.'
        '404':
