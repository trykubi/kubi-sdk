    post:
      operationId: createScreen
      summary: Create a screen
      description: |-
        Needs the `power` permission. Answers within 5 s.

        Creates a screen and starts it, blank or from `template_id`. Returns 202 with an operation; the screen is listed at once as `provisioning`. A persistent screen (the default) goes on the monthly bill: the prorated price for the rest of the month is invoiced first and the machine is made once it is paid; a card that declines or needs 3-D Secure fails the operation with PAYMENT_REQUIRED and a pay link; while the organization is on hold for an unpaid invoice, the call itself answers 402 PAYMENT_REQUIRED. A disposable screen is paid from usage credit, its first billing step at once; with no credit: 402 CREDIT_EXHAUSTED. `ends_in_s` gives a disposable screen an end time. A blank screen resumes a desktop the host booted ahead and is ready in seconds; one from a template boots its disk. Over the organization's screen cap (both kinds count): 402 QUOTA_EXCEEDED. No free machine: 409 NO_CAPACITY, nothing charged.
