      description: Present while a payment is late. Pass it on to the person.
      schema:
        type: string
        maxLength: 300
      example: 'Payment failed. Screens stop 29 Oct. Pay: https://console.trykubi.com/settings/billing'
    Deprecation:
      description: 'RFC 9745: present when this route is deprecated, with the date it was. The SDK logs one warning.'
      schema:
        type: string
        maxLength: 30
        pattern: ^@[0-9]{1,12}$
      example: "@1798761600"
    Sunset:
      description: 'RFC 8594: present when the route has an end date (HTTP date).'
      schema:
        type: string
        maxLength: 40
      example: Mon, 01 Nov 2027 00:00:00 GMT
